# ─────────────────────────────────────────────────────────────
# People shown on the "Our Team" page, one list per tab:
#   founders · core_team · leadership_committee · ambassadors
#
# For each person:
#   name:      Full name
#   role:      Title (e.g. Co-Founder, Ambassador – Roseville High)
#   photo:     Upload a square-ish image to assets/team/ and put its path,
#              e.g. /assets/team/jane-doe.jpg. Leave blank to show initials.
#   linkedin:  Full LinkedIn profile URL. Leave blank to hide the button.
#   bio:       A short "about me".
#
# To add someone, copy a block (from "- name:" to "bio:") and edit it.
# A tab with no one in it shows a "coming soon" message.
# ─────────────────────────────────────────────────────────────

founders:
  - name: Gianna Natt
    role: Founder
    photo: /assets/team/gianna-natt.jpg
    linkedin: https://www.linkedin.com/in/gianna-natt-888695425/
    bio: >-
      Living with a chronic illness and spending so much time in hospitals often
      made me feel lonely and disconnected from life outside my hospital room.
      Those experiences inspired me to start Hope in the Halls so I could help
      other children feel supported and less alone. I wanted to turn what I went
      through into something meaningful by bringing comfort, joy, and hope to
      their hospital stays.

  - name: Alexis O'Brien
    role: Founder
    photo: /assets/team/alexis-obrien.jpg
    linkedin: https://www.linkedin.com/in/alexis-o%E2%80%99brien-17b6b940b/
    bio: >-
      Growing up surrounded by family with chronic illnesses from a young age
      deeply shaped my perspective on life and inspired me to create Hope in
      the Halls. I strongly believe that every child deserves access to the
      support, resources, and opportunities they need to pursue their goals
      and reach their full potential.

  - name: Kusum Sidhu
    role: Founder
    photo: /assets/team/kusum-sidhu.jpg
    linkedin: https://www.linkedin.com/in/kusum-sidhu-092768442/
    bio: >-
      I wanted to create an impact and a meaningful difference in patients'
      lives. I recognize that hospitals can be one of the most overwhelming
      places for patients and their families, and I want to be able to bring
      moments of comfort, joy, and hope to these individuals. Whether it be
      from a care package or a toy drive, I hope to spread positivity one
      hallway at a time.

