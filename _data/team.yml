# ─────────────────────────────────────────────────────────────
# People shown on the "Our Team" page, one list per tab:
#   founders · core_team · leadership_committee · ambassadors
#
# For each person:
#   name:      Full name
#   role:      Title (e.g. Co-Founder, Ambassador – Roseville High)
#   photo:     Upload a square-ish image to assets/team/ and put its path,
#              e.g. /assets/team/jane-doe.jpg. Leave blank to show initials.
#   linkedin:  Full LinkedIn profile URL. Leave blank to hide the button.
#   bio:       A short "about me".
#
# To add someone, copy a block (from "- name:" to "bio:") and edit it.
# A tab with no one in it shows a "coming soon" message.
# ─────────────────────────────────────────────────────────────

founders:
  - name: Founder Name
    role: Co-Founder
    photo:
    linkedin: https://www.linkedin.com/in/your-profile/
    bio: >-
      Write a short "about me" here: who you are, what school or work you're
      part of, and why you started Hope in the Halls.

  - name: Founder Name
