---
layout: default
---
<article class="post">
  <header class="page-hero post-header">
    <div class="container narrow">
      <a class="text-link back" href="{{ '/blog/' | relative_url }}">← All posts</a>
      <p class="post-meta"><span class="tag tag-{{ page.category | downcase }}">{{ page.category }}</span> {{ page.date | date: "%B %-d, %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.author %}<p class="post-author">By {{ page.author }}</p>{% endif %}
    </div>
  </header>
  <div class="container narrow post-body">
    {% if page.image %}<img class="post-cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">{% endif %}
    {{ content }}
  </div>
  <div class="container narrow post-footer">
    <p>Want to help? <a href="{{ site.gofundme }}" target="_blank" rel="noopener">Donate on GoFundMe</a> or <a href="{{ '/#involved' | relative_url }}">get involved</a>.</p>
  </div>
</article>
