# Copies the latest Substack posts onto the website's Newsletter page.
# Runs every 3 hours, and can be run by hand from the Actions tab
# ("Sync Substack newsletter" → "Run workflow").
name: Sync Substack newsletter

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest posts
        run: python3 scripts/fetch_substack.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- _data/newsletter_posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/newsletter_posts.json
          git commit -m "Update newsletter posts from Substack"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow may not start a Pages build on their own,
      # so ask GitHub Pages to rebuild the site.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
